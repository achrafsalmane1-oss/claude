<title>Outreach Waterfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top bar over one focused column; the queue works one card at a time.
   Chrome stays graphite — the only hues are the three channels and state. */
:root{
  --paper:#f5f5f3; --card:#fffffe; --sunk:#ececea; --line:#dedddb; --line-soft:#eae9e6;
  --ink:#16181c; --ink-2:#5c6069; --ink-3:#8b8f98;
  --brand:#16181c; --brand-ink:#fffffe; --focus:#3d6ef5;
  --email:#2f5fd0; --email-bg:#e7edfb; --li:#0a66c2; --li-bg:#e3eefa; --call:#15803d; --call-bg:#e3f3e8;
  --warn:#9a5b00; --warn-bg:#fbf0dd; --bad:#b3261e; --bad-bg:#fbeae8; --good:#15803d; --good-bg:#e3f3e8;
  --display:"Familjen Grotesk",Georgia,serif; --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 20px rgba(20,22,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1115; --card:#171a20; --sunk:#1e222a; --line:#2a2f39; --line-soft:#232830;
  --ink:#e9eaee; --ink-2:#a2a8b4; --ink-3:#757c89;
  --brand:#e9eaee; --brand-ink:#12141a; --focus:#7f9dff;
  --email:#8aa9f5; --email-bg:#1a2340; --li:#6fb3f0; --li-bg:#12293f; --call:#63c98a; --call-bg:#13301f;
  --warn:#dfa145; --warn-bg:#33270f; --bad:#f08d85; --bad-bg:#361a18; --good:#63c98a; --good-bg:#13301f;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f1115; --card:#171a20; --sunk:#1e222a; --line:#2a2f39; --line-soft:#232830;
  --ink:#e9eaee; --ink-2:#a2a8b4; --ink-3:#757c89;
  --brand:#e9eaee; --brand-ink:#12141a; --focus:#7f9dff;
  --email:#8aa9f5; --email-bg:#1a2340; --li:#6fb3f0; --li-bg:#12293f; --call:#63c98a; --call-bg:#13301f;
  --warn:#dfa145; --warn-bg:#33270f; --bad:#f08d85; --bad-bg:#361a18; --good:#63c98a; --good-bg:#13301f;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* shell */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--call);display:block;flex:none}
nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 11px;border-radius:99px;color:var(--ink-2);font-weight:500;cursor:pointer;font-size:.9rem;display:flex;gap:6px;align-items:center}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
nav b{font-size:.7rem;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:1px 6px;font-weight:700}
nav button[aria-current="true"] b{background:color-mix(in srgb,var(--brand-ink) 22%,transparent);color:var(--brand-ink)}
main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
.wrap{display:flex;flex-direction:column;gap:16px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)} .sm{font-size:.85rem} .xs{font-size:.76rem}
.mono{font-family:var(--mono);font-size:.84rem}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.btn:hover{opacity:.88} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);opacity:1}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--bad);color:#fff}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
textarea{font-family:var(--mono);font-size:.85rem;line-height:1.6;resize:vertical;min-height:90px}
label.f{display:block} label.f>span{display:block;font-size:.76rem;color:var(--ink-2);font-weight:600;margin-bottom:5px;letter-spacing:.02em;text-transform:uppercase}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem} .check input{width:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink-2);letter-spacing:.02em}
.tag.email{background:var(--email-bg);color:var(--email)}
.tag.linkedin{background:var(--li-bg);color:var(--li)}
.tag.call{background:var(--call-bg);color:var(--call)}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;font-family:var(--display)}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:1.15rem}
.stack{display:flex;flex-direction:column;gap:12px}
hr{border:0;border-top:1px solid var(--line-soft);margin:0}

/* queue focus card */
.focus-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.chan-strip{height:4px;border-radius:var(--r) var(--r) 0 0}
.chan-strip.email{background:var(--email)} .chan-strip.linkedin{background:var(--li)} .chan-strip.call{background:var(--call)}
.script{background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;padding:14px;font-family:var(--mono);font-size:.85rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.field-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.copyable{font-family:var(--mono);font-size:.84rem;background:var(--sunk);border-radius:7px;padding:3px 8px;user-select:all;word-break:break-all}
.disp{display:flex;flex-wrap:wrap;gap:6px}
.disp button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer;font-weight:500}
.disp button:hover{border-color:var(--ink-3)}
.disp button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.upnext{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.up{display:flex;gap:11px;align-items:center;padding:11px 14px;background:var(--card);cursor:pointer;text-align:left;border:0;width:100%;font:inherit;color:inherit}
.up:hover{background:var(--sunk)}
.up[aria-current="true"]{background:var(--sunk)}
.up .who{font-weight:600;font-size:.9rem}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* people table */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dot-list{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on.email{background:var(--email)} .dot.on.linkedin{background:var(--li)} .dot.on.call{background:var(--call)}

/* steps */
.step{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step-top{display:flex;gap:10px;align-items:center;padding:10px 13px;background:var(--sunk);flex-wrap:wrap}
.step-n{width:24px;height:24px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.step-body{padding:14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 11px;font-size:.82rem;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"][data-c="email"]{background:var(--email-bg);color:var(--email)}
.seg button[aria-pressed="true"][data-c="linkedin"]{background:var(--li-bg);color:var(--li)}
.seg button[aria-pressed="true"][data-c="call"]{background:var(--call-bg);color:var(--call)}
.tok{font-family:var(--mono);font-size:.76rem;background:var(--sunk);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;cursor:pointer}

/* inbox */
.thread{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding-right:4px}
.msg{border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;background:var(--sunk);white-space:pre-wrap;word-break:break-word;font-size:.88rem}
.msg.in{background:var(--email-bg);border-color:transparent}
.msg .meta{display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap}

/* numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .n{font-family:var(--display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:700;margin-top:4px}
.kpi .d{font-size:.78rem;color:var(--ink-3);margin-top:3px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(12,14,18,.45);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.sheet header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.sheet .in{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet footer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:0;font-size:1.3rem;line-height:1;color:var(--ink-3);cursor:pointer;padding:4px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:99px;font-size:.87rem;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.22);animation:pop .16s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.banner{border:1px solid var(--line);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.86rem;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}nav{width:100%;margin-inline-start:0;overflow-x:auto}}
</style>

<div class="bar"><div class="bar-in">
  <span class="logo"><i></i> Outreach</span>
  <span class="tag" id="mode-chip" title="Checking where your work is saved"></span>
  <nav id="nav"></nav>
</div></div>
<main><div id="app" class="wrap"></div></main>
<div id="sheet-root"></div>
<div id="toasts"></div>
<script>
/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CH = { email: "Email", linkedin: "LinkedIn", call: "Call" };
const GATE = { email: "email", linkedin: "linkedin", call: "phone" };
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + (n || 0)); return d.toISOString().slice(0, 10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const name = (c) => [c.first, c.last].filter(Boolean).join(" ") || c.email || c.phone || "Unnamed";
const inits = (c) => ((c.first || "")[0] || "") + ((c.last || "")[0] || "") || "?";
const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  if (m < 10080) return Math.round(m / 1440) + "d ago";
  return new Date(iso).toLocaleDateString();
};
function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 3600);
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || "Copied") + " copied"); }
  catch (e) { toast("Select the text and copy manually", true); }
}
const gmailUrl = (to, su, body) =>
  "https://mail.google.com/mail/?view=cm&fs=1" +
  (to ? "&to=" + encodeURIComponent(to) : "") +
  (su ? "&su=" + encodeURIComponent(su) : "") +
  (body ? "&body=" + encodeURIComponent(body) : "");

/* merge tags: {{first}} and {{first|there}} */
const TOKEN = /\{\{\s*([a-zA-Z0-9_.]+)\s*(?:\|([^}]*?))?\s*\}\}/g;
function ctx(c) {
  const o = { first: c.first || "", last: c.last || "", email: c.email || "", phone: c.phone || "",
    company: c.company || "", title: c.title || "", linkedin: c.linkedin || "",
    name: name(c), signature: S.meta.signature || "", sender: S.meta.sender || "" };
  Object.entries(c.custom || {}).forEach(([k, v]) => { if (!(k in o)) o[k] = String(v ?? ""); });
  return o;
}
function render(tpl, c) {
  const o = ctx(c);
  return String(tpl || "").replace(TOKEN, (_, k, fb) => {
    const v = o[k];
    return v && String(v).trim() ? v : (fb || "").trim();
  });
}
function blanks(tpl, c) {
  const o = ctx(c), out = new Set();
  String(tpl || "").replace(TOKEN, (_, k, fb) => {
    if (!(o[k] && String(o[k]).trim()) && !(fb || "").trim()) out.add(k); return "";
  });
  return [...out];
}

/* ------------------------------------------------------------------ state */
const S = {
  db: null, mode: "local", canWrite: null, ready: false, view: "queue",
  contacts: [], plays: [], meta: { signature: "", sender: "", active: "" },
  focus: null, thread: null, filter: "", chanFilter: "", pending: new Set(),
};
const activePlay = () => S.plays.find((p) => p.id === S.meta.active) || S.plays[0] || null;
const playById = (id) => S.plays.find((p) => p.id === id) || null;

const LKEY = "outreach.v1";
const local = {
  ok: true,
  read() {
    try { return JSON.parse(localStorage.getItem(LKEY) || "null"); }
    catch (e) { this.ok = false; return null; }
  },
  write(payload) {
    try { localStorage.setItem(LKEY, JSON.stringify(payload)); this.ok = true; return true; }
    catch (e) {
      this.ok = false;
      toast(/quota|exceeded/i.test(String(e && e.name) + String(e && e.message))
        ? "This browser is out of storage — export a backup and remove old contacts"
        : "This browser is blocking storage, so nothing is being saved", true);
      return false;
    }
  },
};
function saveLocal() {
  return local.write({ v: 1, contacts: S.contacts, plays: S.plays, meta: S.meta, savedAt: new Date().toISOString() });
}

async function writeDoc(path, data, merge) {
  if (!S.db) { toast("Storage not available in this view", true); return false; }
  for (let i = 0; i < 3; i++) {
    try { merge ? await S.db.doc(path).update(data) : await S.db.doc(path).set(data); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument") { S.canWrite = false; renderAll(); toast("You have view-only access here", true); return false; }
      if (e && (e.code === "unavailable" || e.code === "resource_exhausted")) { await new Promise((r) => setTimeout(r, 250 * (i + 1) + Math.random() * 200)); continue; }
      if (e && e.code === "quota_exceeded") { toast("Storage is full — delete some contacts", true); return false; }
      toast("Could not save: " + (e && e.message ? e.message : "unknown error"), true); return false;
    }
  }
  toast("Could not save — check your connection", true); return false;
}
const saveContact = (c) => (S.mode === "cloud" ? writeDoc("contacts/" + c.id, c) : saveLocal());
const savePlay = (p) => (S.mode === "cloud" ? writeDoc("plays/" + p.id, p) : saveLocal());
const saveMeta = () => (S.mode === "cloud" ? writeDoc("meta/app", S.meta) : saveLocal());
const dropContact = (c) => (S.mode === "cloud" ? S.db.doc("contacts/" + c.id).delete().catch(() => {}) : saveLocal());

async function loadAll() {
  if (S.mode === "cloud") {
    const [cs, ps, m] = await Promise.all([
      S.db.collection("contacts").limit(1000).get(),
      S.db.collection("plays").limit(50).get(),
      S.db.doc("meta/app").get(),
    ]);
    S.contacts = cs.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.plays = ps.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (m.exists) S.meta = { ...S.meta, ...m.data() };
    return;
  }
  const saved = local.read();
  if (saved) {
    S.contacts = saved.contacts || [];
    S.plays = saved.plays || [];
    S.meta = { ...S.meta, ...(saved.meta || {}) };
  }
  // A shared playbook the owner wrote is readable even without write access — adopt it once.
  if (!S.plays.length && S.db) {
    try {
      const ps = await S.db.collection("plays").limit(50).get();
      const shared = ps.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (shared.length) { S.plays = shared; S.meta.active = shared[0].id; saveLocal(); }
    } catch (e) { /* not readable in this view */ }
  }
}

/* ------------------------------------------------------- waterfall engine */
function stepsOf(c) { const p = playById(c.play); return p ? p.steps || [] : []; }
function gateOf(st) { return st.gate || GATE[st.ch] || ""; }
function hasField(c, f) { return !!(f && String(c[f] || "").trim()); }

/** Walk past steps this contact can't receive. Returns {changed, done}. */
function settle(c) {
  const steps = stepsOf(c);
  if (!c.play || c.state !== "running" || !steps.length) return { changed: false };
  let changed = false, guard = 0;
  while (guard++ < steps.length + 1) {
    if (c.step >= steps.length) { c.state = "finished"; c.due = null; return { changed: true }; }
    const st = steps[c.step], gate = gateOf(st);
    if (gate && !hasField(c, gate)) {
      c.skips = (c.skips || 0) + 1;
      c.log = [...(c.log || []), { ts: new Date().toISOString(), ch: st.ch, dir: "skip",
        body: "Skipped step " + (c.step + 1) + " — no " + gate + " on file." }].slice(-60);
      c.step += 1; changed = true;
      c.due = c.step < steps.length ? addDays(steps[c.step].wait) : null;
      continue;
    }
    break;
  }
  return { changed };
}

/** Everyone whose next step is due today or earlier, soonest first. */
function queue() {
  const t = today();
  return S.contacts
    .filter((c) => c.play && c.state === "running" && c.due && c.due <= t && stepsOf(c)[c.step])
    .filter((c) => !S.chanFilter || stepsOf(c)[c.step].ch === S.chanFilter)
    .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : name(a).localeCompare(name(b))));
}
function card(c) {
  const st = stepsOf(c)[c.step];
  if (!st) return null;
  return { st, subject: render(st.subj, c), body: render(st.body, c) };
}

async function advance(c, entry) {
  const steps = stepsOf(c);
  c.log = [...(c.log || []), entry].slice(-60);
  c.touches = (c.touches || 0) + 1;
  c.lastAt = entry.ts;
  if (c.status === "new") c.status = "working";
  c.step += 1;
  if (c.step >= steps.length) { c.state = "finished"; c.due = null; }
  else c.due = addDays(steps[c.step].wait);
  settle(c);
  await saveContact(c);
}

async function logReply(c, ch, text) {
  c.log = [...(c.log || []), { ts: new Date().toISOString(), ch, dir: "in", body: text }].slice(-60);
  c.status = "replied"; c.state = "replied"; c.due = null; c.lastAt = new Date().toISOString();
  await saveContact(c);
}

async function startSequence(c, playId) {
  const p = playById(playId); if (!p || !(p.steps || []).length) return;
  c.play = p.id; c.step = 0; c.state = "running"; c.due = addDays(p.steps[0].wait);
  if (c.status === "replied" || c.status === "out") c.status = "working";
  settle(c);
  await saveContact(c);
}

/* -------------------------------------------------------------- CSV parse */
function parseCSV(text) {
  const rows = []; let row = [], val = "", q = false;
  text = text.replace(/\r\n?/g, "\n");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { val += '"'; i++; } else q = false; }
      else val += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(val); val = ""; }
    else if (ch === "\n") { row.push(val); rows.push(row); row = []; val = ""; }
    else val += ch;
  }
  if (val || row.length) { row.push(val); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ""));
}
const HINTS = {
  first: ["first name", "firstname", "first", "given name", "fname"],
  last: ["last name", "lastname", "last", "surname", "family name", "lname"],
  email: ["email", "email address", "work email", "e-mail", "personal email", "email 1"],
  phone: ["phone", "phone number", "mobile", "cell", "direct dial", "telephone", "mobile phone", "mobile number"],
  linkedin: ["linkedin", "linkedin url", "linkedin profile", "li url", "profile url", "linkedin link"],
  company: ["company", "company name", "organization", "organisation", "account", "employer"],
  title: ["title", "job title", "position", "role", "headline"],
};
function guessMap(headers) {
  const used = new Set();
  return headers.map((h) => {
    const k = String(h || "").trim().toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
    for (const [field, hints] of Object.entries(HINTS)) {
      if (!used.has(field) && (hints.includes(k) || k.replace(/ /g, "_") === field)) { used.add(field); return field; }
    }
    return "custom";
  });
}
const cleanPhone = (v) => String(v || "").replace(/[^\d+]/g, "");
const cleanLi = (v) => { let s = String(v || "").trim(); if (/^(www\.)?linkedin\.com/i.test(s)) s = "https://" + s; return s; };

    <div class="kpi"><div class="n">${sent("email")}</div><div class="l">Emails</div><div class="d">logged as sent</div></div>

    <div class="kpi"><div class="n">${sent("call")}</div><div class="l">Calls</div><div class="d">${dispoRows[0] ? esc(dispoRows[0][0]) + " most common" : "none logged"}</div></div>
    <div class="kpi"><div class="n">${replies}</div><div class="l">Replies</div><div class="d">${pct(replies, touched)}% of people touched</div></div>
    <div class="kpi"><div class="n">${skips}</div><div class="l">Steps skipped</div><div class="d">missing phone / email / LinkedIn</div></div>
  </div>
  <div class="grid2">
    <div class="card pad stack">
      <h3>Down the waterfall</h3>
      ${perStep.length ? perStep.map((s) => `<div>
        <div class="spread sm"><span><span class="tag ${s.ch}">${CH[s.ch]}</span> Step ${s.i + 1}</span>
          <span class="mono">${s.done} done${s.skipped ? ` · ${s.skipped} skipped` : ""}</span></div>
        <div class="meter" style="margin-top:5px"><i style="width:${pct(s.done, maxStep)}%"></i></div></div>`).join("")
        : '<p class="muted sm">No playbook yet.</p>'}
      <p class="dim xs">Skipped means the person had no phone, email or LinkedIn for that step, so the waterfall moved them on.</p>
    </div>
    <div class="card pad stack">
      <h3>Call outcomes</h3>
      ${dispoRows.length ? dispoRows.map(([k, n]) => `<div>
        <div class="spread sm"><span>${esc(k)}</span><span class="mono">${n}</span></div>
        <div class="meter" style="margin-top:5px"><i style="width:${pct(n, dispoRows.reduce((a, b) => a + b[1], 0))}%;background:var(--call)"></i></div></div>`).join("")
        : '<p class="muted sm">No calls logged yet. Outcomes you pick in the queue show up here.</p>'}
    </div>
  </div>`;
}

<script>
/* ----------------------------------------------------------------- sheets */
function sheet({ title, body, footer }) {
  $("#sheet-root").innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Close">&times;</button></header>
    <div class="in">${body}</div>${footer ? `<footer>${footer}</footer>` : ""}</div></div>`;
  $(".sheet-bg").addEventListener("click", (e) => { if (e.target.classList.contains("sheet-bg")) closeSheet(); });
}
const closeSheet = () => ($("#sheet-root").innerHTML = "");

function threadSheet(id) {
  const c = S.contacts.find((x) => x.id === id); if (!c) return;
  const log = c.log || [];
  const chans = [["email", c.email], ["linkedin", c.linkedin], ["call", c.phone]].filter(([, v]) => v);
  sheet({
    title: name(c),
    body: `<div class="spread">
        <div><p class="muted sm">${esc([c.title, c.company].filter(Boolean).join(" · ") || "No company on file")}</p>
        <div class="row sm" style="margin-top:6px">
          ${c.email ? `<span class="copyable">${esc(c.email)}</span>` : ""}
          ${c.phone ? `<span class="copyable">${esc(c.phone)}</span>` : ""}
          ${c.linkedin ? `<a class="btn ghost sm" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
        </div></div>
        <div class="stack" style="gap:6px">
          <select id="t-status" style="min-width:150px">
            ${[["new", "Not started"], ["working", "In progress"], ["replied", "Replied"], ["out", "Opted out"]]
              .map(([v, l]) => `<option value="${v}" ${c.status === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          ${c.state === "running" ? `<span class="tag">Step ${c.step + 1} of ${stepsOf(c).length}, due ${esc(c.due || "—")}</span>`
            : activePlay() ? `<button class="btn sm" data-act="start-one" data-id="${c.id}">Start playbook</button>` : ""}
        </div></div>
      <hr>
      <div class="thread">${log.length ? log.slice().reverse().map((l) => `<div class="msg ${l.dir === "in" ? "in" : ""}">
        <div class="meta"><span class="tag ${l.ch}">${CH[l.ch] || l.ch}</span>
          <span>${l.dir === "in" ? "they replied" : l.dir === "skip" ? "skipped" : "you sent"}</span>
          <span>${esc(ago(l.ts))}</span>${l.outcome ? `<span class="tag">${esc(l.outcome)}</span>` : ""}</div>
        ${l.subj ? `<strong>${esc(l.subj)}</strong>\n` : ""}${esc(l.body || "")}${l.note ? `\n\n— ${esc(l.note)}` : ""}</div>`).join("")
        : '<p class="muted sm">Nothing logged yet.</p>'}</div>
      <hr>
      <label class="f"><span>Log something they said</span>
        <textarea id="t-reply" rows="3" placeholder="Paste their reply, or type what they said on the phone…"></textarea></label>
      <div class="row">${chans.map(([ch], i) => `<button class="btn ${i ? "ghost" : ""} sm" data-act="t-chan" data-c="${ch}" aria-pressed="${i === 0}">${CH[ch]}</button>`).join("")}
        <span class="dim xs">Logging a reply stops their sequence.</span></div>`,
    footer: `<button class="btn ghost" data-act="close">Close</button>
      <button class="btn" data-act="save-reply" data-id="${c.id}">Log reply</button>`,
  });
}

function importSheet() {
  sheet({
    title: "Import contacts",
    body: `<p class="muted sm">Any CSV works — Clay, Apollo, Sales Navigator, a spreadsheet. Columns are matched automatically and you can fix them on the next screen.</p>
      <label class="f"><span>CSV file</span><input type="file" id="f-file" accept=".csv,text/csv"></label>
      <label class="f"><span>…or paste the rows</span><textarea id="f-text" rows="5" placeholder="first_name,last_name,email,phone,linkedin_url,company,title"></textarea></label>
      <div id="map-area"></div>`,
    footer: `<button class="btn ghost" data-act="sample">Use sample data</button>
      <button class="btn" data-act="map">Continue</button>`,
  });
  $("#f-file").addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { $("#f-text").value = String(r.result); toast("File loaded — press Continue"); };
    r.readAsText(file);
  });
}

function mapSheet(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast("That CSV has no data rows", true); return; }
  const headers = rows[0], guess = guessMap(headers), body = rows.slice(1);
  const fields = ["first", "last", "email", "phone", "linkedin", "company", "title", "custom", "ignore"];
  window.__import = { headers, body };
  sheet({
    title: "Check the columns",
    body: `<p class="muted sm">${body.length} rows. Anything left as <em>custom</em> is kept and becomes a merge tag.</p>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Column</th><th>Becomes</th><th>First row</th></tr></thead>
      <tbody>${headers.map((h, i) => `<tr>
        <td><strong class="sm">${esc(h)}</strong></td>
        <td><select data-col="${i}" style="min-width:130px">${fields.map((f) =>
          `<option value="${f}" ${guess[i] === f ? "selected" : ""}>${f === "custom" ? "custom field" : f}</option>`).join("")}</select></td>
        <td class="dim sm trunc" style="max-width:220px">${esc((body[0] || [])[i] || "")}</td></tr>`).join("")}</tbody></table></div>
      <label class="check"><input type="checkbox" id="f-dedupe" checked> Merge duplicates by email or LinkedIn URL</label>
      ${body.length > 600 ? `<div class="banner">This hosted version holds about 1,000 contacts. Import your best ${Math.min(body.length, 600)} first, or use the desktop version for bigger lists.</div>` : ""}
      <div id="prog"></div>`,
    footer: `<button class="btn ghost" data-act="close">Cancel</button>
      <button class="btn" data-act="do-import">Import ${Math.min(body.length, 600)} contacts</button>`,
  });
}

function settingsSheet() {
  sheet({
    title: "Settings",
    body: `<label class="f"><span>Your name</span><input type="text" id="s-sender" value="${esc(S.meta.sender || "")}" placeholder="How you sign off"></label>
      <label class="f"><span>Signature — drop it into a message with {{signature}}</span>
        <textarea id="s-sig" rows="4" placeholder="Achraf\\nGrowth @ Company\\n+1 555 000 111">${esc(S.meta.signature || "")}</textarea></label>
      <hr>
      <h3>Where your work is saved</h3>
      ${S.mode === "cloud"
        ? `<p class="muted sm">Saved to this page's shared storage, because you're signed in with edit access. Anyone else with edit access sees the same list, on any device.</p>`
        : `<p class="muted sm">Saved in this browser, on this device — no account needed. Nobody else can see it, and it won't follow you to another browser or phone. Clearing your browsing data erases it, so take a backup now and then.</p>`}
      <div class="row">
        <button class="btn ghost sm" data-act="backup">Back up everything</button>
        <label class="btn ghost sm" style="cursor:pointer">Restore a backup<input type="file" id="s-restore" accept=".json,application/json" hidden></label>
        <span class="dim xs">${S.contacts.length} contacts · ${S.contacts.reduce((n, c) => n + (c.log || []).length, 0)} logged touches</span>
      </div>
      <hr>
      <p class="muted sm">Emails open in Gmail with everything filled in — you press send, so they go from your real mailbox and land in your sent folder. Nothing is sent by this page on its own.</p>`,
    footer: `<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save-settings">Save</button>`,
  });
  wireRestore();
}

function wireRestore() {
  const inp = $("#s-restore");
  if (!inp) return;
  inp.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try { data = JSON.parse(String(r.result)); }
      catch (err) { toast("That file isn't a backup from this page", true); return; }
      if (!data || !Array.isArray(data.contacts)) { toast("That backup has no contacts in it", true); return; }
      window.__restore = data;
      confirmSheet("Restore this backup?",
        `It holds ${data.contacts.length} contacts${data.savedAt ? ", saved " + ago(data.savedAt) : ""}. This replaces everything currently in the page.`,
        "Replace with backup", "do-restore");
    };
    r.readAsText(file);
  });
}

function confirmSheet(title, text, label, act, id) {
  sheet({ title, body: `<p class="muted">${esc(text)}</p>`,
    footer: `<button class="btn ghost" data-act="close">Cancel</button>
      <button class="btn danger" data-act="${act}" ${id ? `data-id="${id}"` : ""}>${esc(label)}</button>` });
}

/* ------------------------------------------------------------- CSV export */
async function exportCsv(what) {
  const dl = await claude.use("downloads");
  let head, lines;
  if (what === "activity") {
    head = ["when", "name", "company", "channel", "direction", "outcome", "subject", "body", "note"];
    lines = S.contacts.flatMap((c) => (c.log || []).map((l) =>
      [l.ts, name(c), c.company || "", l.ch, l.dir, l.outcome || "", l.subj || "", (l.body || "").replace(/\n/g, " "), l.note || ""]));
  } else {
    head = ["first", "last", "email", "phone", "linkedin", "company", "title", "stage", "step", "touches", "last_activity"];
    lines = S.contacts.map((c) => [c.first, c.last, c.email, c.phone, c.linkedin, c.company, c.title,
      c.status || "new", c.state === "running" ? c.step + 1 : "", c.touches || 0, c.lastAt || ""]);
  }
  const csv = [head, ...lines].map((r) => r.map((v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\n");
  if (!dl) { await copy(csv, "CSV"); return; }
  try { await dl.save({ filename: what === "activity" ? "outreach-activity.csv" : "outreach-contacts.csv", data: csv }); }
  catch (e) { await copy(csv, "CSV"); }
}

<script>
/* ---------------------------------------------------------------- actions */
let pickedOutcome = "", threadChan = "email";

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const c = id ? S.contacts.find((x) => x.id === id) : null;
  const play = activePlay();

  const guard = () => {
    if (S.mode === "local" && !local.ok) { toast("This browser isn't letting the page save anything", true); return false; }
    return true;
  };

  switch (act) {
    case "nav": S.view = el.dataset.v; S.filter = ""; renderAll(); window.scrollTo({ top: 0 }); break;
    case "close": closeSheet(); break;
    case "copy": copy(el.dataset.text, el.dataset.label); break;
    case "chan": S.chanFilter = el.dataset.c; S.focus = null; renderAll(); break;
    case "focus": S.focus = id; pickedOutcome = ""; renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "thread": threadChan = "email"; threadSheet(id); break;
    case "import": if (guard()) importSheet(); break;
    case "settings": settingsSheet(); break;
    case "inbox-filter": S.filter = el.dataset.f; renderAll(); break;
    case "export": exportCsv("contacts"); break;
    case "export-activity": exportCsv("activity"); break;

    case "pick":
      pickedOutcome = el.dataset.d;
      document.querySelectorAll('#disp [data-act="pick"]').forEach((b) => b.setAttribute("aria-pressed", b === el));
      break;

    case "done": {
      if (!guard() || !c) break;
      const k = card(c); if (!k) break;
      el.disabled = true;
      const noteEl = $("#note");
      await advance(c, { ts: new Date().toISOString(), ch: k.st.ch, dir: "out",
        subj: k.subject || "", body: k.body, outcome: pickedOutcome || (k.st.ch === "email" ? "Sent" : "Done"),
        note: noteEl ? noteEl.value.trim() : "" });
      pickedOutcome = ""; S.focus = null;
      toast("Logged — next one up");
      renderAll();
      break;
    }
    case "skip": {
      if (!guard() || !c) break;
      const k = card(c);
      await advance(c, { ts: new Date().toISOString(), ch: k.st.ch, dir: "skip", body: "Skipped step " + (c.step + 1) + " by hand." });
      S.focus = null; renderAll(); toast("Skipped");
      break;
    }
    case "snooze": {
      if (!guard() || !c) break;
      c.due = addDays(1); await saveContact(c); S.focus = null; renderAll(); toast("Back tomorrow");
      break;
    }
    case "replied": if (c) { threadChan = stepsOf(c)[c.step] ? stepsOf(c)[c.step].ch : "email"; threadSheet(c.id); } break;
    case "t-chan":
      threadChan = el.dataset.c;
      document.querySelectorAll('[data-act="t-chan"]').forEach((b) => { b.setAttribute("aria-pressed", b === el); b.classList.toggle("ghost", b !== el); });
      break;
    case "save-reply": {
      if (!guard() || !c) break;
      const text = $("#t-reply") ? $("#t-reply").value.trim() : "";
      const status = $("#t-status") ? $("#t-status").value : null;
      if (text) await logReply(c, threadChan, text);
      else if (status && status !== c.status) {
        c.status = status;
        if (status === "out" || status === "replied") { c.state = status === "out" ? "stopped" : "replied"; c.due = null; }
        await saveContact(c);
      }
      closeSheet(); S.focus = null; renderAll();
      toast(text ? "Reply logged — sequence stopped" : "Saved");
      break;
    }
    case "start-one": if (guard() && c && play) { await startSequence(c, play.id); closeSheet(); renderAll(); toast("Playbook started"); } break;
    case "start-all": {
      if (!guard() || !play) break;
      const targets = S.contacts.filter((x) => !x.play && x.status !== "out");
      if (!targets.length) { toast("Everyone is already in it"); break; }
      confirmSheet("Start the playbook", `${targets.length} ${targets.length === 1 ? "person" : "people"} will enter “${play.name}”. Steps they can't receive get skipped automatically.`, "Start on " + targets.length, "do-start-all");
      break;
    }
    case "do-start-all": {
      closeSheet();
      const targets = S.contacts.filter((x) => !x.play && x.status !== "out");
      let n = 0;
      for (const t of targets) { await startSequence(t, play.id); n++; }
      renderAll(); toast(`Started on ${n}`);
      break;
    }
    case "sample": {
      if (!guard()) break;
      closeSheet();
      for (const s of SAMPLE) {
        const rec = { id: "c" + uid(), ...s, status: "new", state: "idle", step: 0, play: "", due: null, touches: 0, log: [], createdAt: new Date().toISOString() };
        S.contacts.push(rec); await saveContact(rec);
      }
      if (!S.plays.length) await seedStarter();
      renderAll(); toast("5 sample leads added");
      break;
    }
    case "starter": if (guard()) { await seedStarter(); renderAll(); toast("Playbook created — edit the copy"); } break;

    case "map": {
      const text = $("#f-text") ? $("#f-text").value.trim() : "";
      if (!text) { toast("Pick a file or paste rows first", true); break; }
      mapSheet(text);
      break;
    }
    case "do-import": await runImport(el); break;

    case "backup": {
      const payload = JSON.stringify({ v: 1, contacts: S.contacts, plays: S.plays, meta: S.meta, savedAt: new Date().toISOString() }, null, 2);
      const dl = await claude.use("downloads");
      if (dl) {
        try { await dl.save({ filename: "outreach-backup-" + today() + ".json", data: payload }); toast("Backup saved"); }
        catch (err) { await copy(payload, "Backup"); }
      } else await copy(payload, "Backup");
      break;
    }
    case "do-restore": {
      const data = window.__restore; if (!data) break;
      closeSheet();
      S.contacts = data.contacts || [];
      S.plays = (data.plays || []).length ? data.plays : S.plays;
      S.meta = { ...S.meta, ...(data.meta || {}) };
      if (S.mode === "cloud") { for (const c of S.contacts) await saveContact(c); for (const p of S.plays) await savePlay(p); await saveMeta(); }
      else saveLocal();
      renderAll(); toast(`Restored ${S.contacts.length} contacts`);
      break;
    }

    case "save-settings":
      S.meta.sender = $("#s-sender").value.trim();
      S.meta.signature = $("#s-sig").value;
      await saveMeta(); closeSheet(); renderAll(); toast("Saved");
      break;

    /* playbook editing */
    case "chan-set": { const p = activePlay(); p.steps[+el.dataset.i].ch = el.dataset.c; renderAll(); break; }
    case "step-add": {
      const p = activePlay() || { id: "p" + uid(), name: "My waterfall", steps: [] };
      if (!S.plays.includes(p)) { S.plays.push(p); S.meta.active = p.id; }
      p.steps.push({ ch: el.dataset.c, wait: p.steps.length ? 2 : 0, subj: "", body: "", gate: "" });
      renderAll(); break;
    }
    case "step-del": { const p = activePlay(); p.steps.splice(+el.dataset.i, 1); renderAll(); break; }
    case "step-up": { const p = activePlay(), i = +el.dataset.i; [p.steps[i - 1], p.steps[i]] = [p.steps[i], p.steps[i - 1]]; renderAll(); break; }
    case "step-down": { const p = activePlay(), i = +el.dataset.i; [p.steps[i + 1], p.steps[i]] = [p.steps[i], p.steps[i + 1]]; renderAll(); break; }
    case "save-play": {
      if (!guard()) break;
      const p = activePlay(); if (!p) break;
      p.name = $("#p-name").value.trim() || "My waterfall";
      readStepInputs(p);
      await savePlay(p); S.meta.active = p.id; await saveMeta();
      renderAll(); toast("Playbook saved");
      break;
    }
    case "preview": {
      const p = activePlay(); readStepInputs(p);
      const st = p.steps[+el.dataset.i];
      const who = S.contacts.find((x) => x.first) || SAMPLE[0];
      const miss = blanks((st.subj || "") + " " + (st.body || ""), who);
      sheet({ title: "Preview for " + name(who),
        body: `${st.subj ? `<label class="f"><span>Subject</span><div class="script">${esc(render(st.subj, who))}</div></label>` : ""}
          <label class="f"><span>${st.ch === "call" ? "Script" : "Message"}</span><div class="script">${esc(render(st.body, who))}</div></label>
          ${miss.length ? `<div class="banner">These tags come out empty for this contact: ${esc(miss.join(", "))}. Give them a fallback like {{${esc(miss[0])}|there}}.</div>` : ""}`,
        footer: `<button class="btn" data-act="close">Close</button>` });
      break;
    }
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "q") { S.filter = el.value; const p = el.selectionStart; renderAll(); const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(p, p); } }
});

function readStepInputs(p) {
  if (!p) return;
  document.querySelectorAll("[data-f]").forEach((inp) => {
    const i = +inp.dataset.i, f = inp.dataset.f;
    if (!p.steps[i]) return;
    p.steps[i][f] = f === "wait" ? Math.max(0, +inp.value || 0) : inp.value;
  });
}

async function seedStarter() {
  const p = { id: "p" + uid(), ...STARTER };
  S.plays.push(p); S.meta.active = p.id;
  await savePlay(p); await saveMeta();
}

async function runImport(btn) {
  const { headers, body } = window.__import || {};
  if (!body) return;
  const map = {};
  document.querySelectorAll("[data-col]").forEach((s) => (map[+s.dataset.col] = s.value));
  const dedupe = $("#f-dedupe") ? $("#f-dedupe").checked : true;
  const rows = body.slice(0, 600);
  btn.disabled = true;
  const prog = $("#prog");
  let made = 0, merged = 0, skipped = 0;

  for (let n = 0; n < rows.length; n++) {
    const r = rows[n];
    const rec = { first: "", last: "", email: "", phone: "", linkedin: "", company: "", title: "", custom: {} };
    headers.forEach((h, i) => {
      const field = map[i], v = String(r[i] ?? "").trim();
      if (!v || field === "ignore") return;
      if (field === "custom") rec.custom[String(h).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "")] = v;
      else rec[field] = v;
    });
    rec.email = rec.email.toLowerCase();
    rec.phone = cleanPhone(rec.phone);
    rec.linkedin = cleanLi(rec.linkedin);
    if (!rec.email && !rec.phone && !rec.linkedin) { skipped++; continue; }

    let hit = null;
    if (dedupe) hit = S.contacts.find((x) => (rec.email && x.email === rec.email) || (rec.linkedin && x.linkedin === rec.linkedin));
    if (hit) {
      ["first", "last", "email", "phone", "linkedin", "company", "title"].forEach((f) => { if (!hit[f] && rec[f]) hit[f] = rec[f]; });
      hit.custom = { ...(hit.custom || {}), ...rec.custom };
      await saveContact(hit); merged++;
    } else {
      const fresh = { id: "c" + uid(), ...rec, status: "new", state: "idle", step: 0, play: "", due: null, touches: 0, log: [], createdAt: new Date().toISOString() };
      S.contacts.push(fresh);
      const ok = await saveContact(fresh);
      if (!ok) { S.contacts.pop(); break; }
      made++;
    }
    if (prog && n % 5 === 0) prog.innerHTML = `<div class="meter"><i style="width:${pct(n + 1, rows.length)}%"></i></div>
      <p class="dim xs" style="margin-top:6px">${n + 1} of ${rows.length}…</p>`;
  }
  if (!S.plays.length) await seedStarter();
  closeSheet(); S.view = "people"; renderAll();
  toast(`${made} added${merged ? `, ${merged} merged` : ""}${skipped ? `, ${skipped} without contact details` : ""}`);
}

/* ------------------------------------------------------------------- boot */
async function boot() {
  renderAll();
  try { S.db = await claude.use("db"); } catch (e) { S.db = null; }
  let canWrite = false;
  if (S.db) {
    try {
      const user = await claude.use("user");
      canWrite = user && typeof user.can === "function" ? (await user.can("data.write")) !== false : true;
    } catch (e) { canWrite = true; }
  }
  // Cloud storage needs a signed-in account with edit access. Everyone else
  // keeps their work in this browser, so the page works straight from a link.
  S.mode = S.db && canWrite ? "cloud" : "local";
  if (S.mode === "local") local.read();

  try { await loadAll(); }
  catch (e) { toast("Could not load your data — reload the page", true); }
  if (!S.plays.length) await seedStarter();

  let moved = false;
  for (const c of S.contacts) { const r = settle(c); if (r.changed) { moved = true; if (S.mode === "cloud") await saveContact(c); } }
  if (moved && S.mode === "local") saveLocal();

  S.ready = true;
  renderAll();

  if (S.mode !== "cloud") return;
  S.db.collection("contacts").limit(1000).onSnapshot((snap) => {
    if (!S.ready) return;
    const open = !!$(".sheet-bg");
    S.contacts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (!open) renderAll(); else renderNav();
  }, () => {});
  S.db.collection("plays").limit(50).onSnapshot((snap) => {
    if (S.view === "playbook" || !S.ready) return;
    S.plays = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }, () => {});
}
boot();
</script>
