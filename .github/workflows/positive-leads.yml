name: Positive leads pipeline

# Processes every NEW positive (INTERESTED) reply in the PlusVibe unibox
# (both workspaces) -> GHL round-robin -> reply+CC agent, and commits the
# updated dedup state back so nothing is ever processed twice.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 1 to log without creating contacts or sending mail"
        required: false
        default: "0"

concurrency:
  group: positive-leads
  cancel-in-progress: false   # never run two copies at once (avoids double-send)

permissions:
  contents: write             # to commit updated state.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline
        env:
          PLUSVIBE_API_KEY: ${{ secrets.PLUSVIBE_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          THIBAUT_EMAIL: ${{ secrets.THIBAUT_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python positive_leads_automation/pipeline.py

      # Le pont Haven <-> Slack tourne ici plutot que sur sa propre planification :
      # GitHub etrangle les workflows planifies de ce depot (13 passages par jour
      # pour un cron */15 qui en demande 96), et deux planifications concurrentes
      # se partagent ce budget. Greffe ici, l'alerte part a chaque passage.
      - name: Haven - pont Slack / PlusVibe
        if: ${{ always() }}
        env:
          PLUSVIBE_API_KEY: ${{ secrets.PLUSVIBE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C4L761EMA' }}
          BCC_TO: ${{ vars.BCC_TO || 'achraf@havenstcapital.com' }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION || 'U0C5AT75UCQ' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python haven_alerts/alert.py

      - name: Commit updated state
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name  "landquire-bot"
          git config user.email "bot@landquire.local"
          git add positive_leads_automation/state.json haven_alerts/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pipeline + haven state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No state change."
          fi
