name: Haven - pont Slack / PlusVibe

# Surveille le workspace HSC (Haven St Capital) dans PlusVibe et poste dans
# le canal Slack #positivereplies des qu'une reponse est etiquetee INTERESTED.
# Dans l'autre sens, tout message ecrit dans un fil Slack part au prospect via
# PlusVibe, avec BCC_TO en copie cachee.

on:
  schedule:
    - cron: "*/5 * * * *"      # toutes les 5 minutes (cadence best-effort GitHub)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 pour journaliser sans envoyer"
        required: false
        default: "0"

concurrency:
  group: haven-alerts
  cancel-in-progress: false     # jamais deux passages en parallele

permissions:
  contents: write               # pour committer l'etat de deduplication

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pont Slack <-> PlusVibe
        env:
          PLUSVIBE_API_KEY: ${{ secrets.PLUSVIBE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C4L761EMA' }}
          BCC_TO: ${{ vars.BCC_TO || 'achraf@havenstcapital.com' }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION || 'U0C5AT75UCQ' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python haven_alerts/alert.py

      - name: Sauvegarde de l'etat
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name  "haven-bot"
          git config user.email "bot@haven.local"
          if ! git diff --quiet -- haven_alerts/state.json; then
            git add haven_alerts/state.json
            git commit -m "chore: etat alertes Haven [skip ci]"
            git push
          else
            echo "Aucun changement d'etat."
          fi
