services:
  - type: web
    name: colddrops
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MOLTSETS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_FROM_NUMBER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COLDDROPS_DB
        value: /var/data/colddrops.db
    disk:
      name: colddrops-data
      mountPath: /var/data
      sizeGB: 1
