# Fly.io deployment for Colddrops.
#
# One-time setup (needs the flyctl CLI + a Fly account):
#   1. Install: https://fly.io/docs/flyctl/install/
#   2. fly auth login
#   3. fly launch --copy-config --no-deploy      # pick a unique app name + region
#   4. fly volume create colddrops_data --size 1 # 1 GB durable disk for SQLite
#   5. fly deploy
#   6. fly open                                  # opens your live URL
#
# Runs at ~$0 when idle (scales to zero) and boots with no keys:
#   SMS = code shown in-app, voice = free gTTS, delivery = dry-run.
# Add keys later with:  fly secrets set TELNYX_API_KEY=... ELEVENLABS_API_KEY=...

app = "colddrops"
primary_region = "iad"   # change to the region nearest you (e.g. lhr, syd, fra)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  COLDDROPS_DB = "/data/colddrops.db"   # lives on the durable volume below

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# Durable disk — the SQLite database survives redeploys and restarts.
[[mounts]]
  source = "colddrops_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
